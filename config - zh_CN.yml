scoreTransfer: # 分数转移
  enable: true # 是否启用
  port: 8082 # 网页服务端口
  batchSize: 4 # 每批转移曲目数 (舞萌一次游玩上限)
  enterTimeoutSeconds: 120 # 等待进入选歌界面的超时时间(秒)
  trackTimeoutSeconds: 120 # 等待单曲完成的超时时间(秒)
  fillRemainingTracks: true # 最后一首打完后若本局还有剩余 Track，则重复最后一首直到结算/登出
dummyLogin: # 自动登录(刷卡)
  enable: true # 是否启用
  defaultUserId: 1 # 默认用户ID
