scoreTransfer: # 分数转移
  enable: true # 是否启用
  port: 8082 # 网页服务端口
  batchSize: 4 # 每批转移曲目数 (舞萌一次游玩上限)
  enterTimeoutSeconds: 120 # 等待进入选歌界面的超时时间(秒)
  trackTimeoutSeconds: 120 # 等待单曲完成的超时时间(秒)
  fillRemainingTracks: true # 最后一首打完后若本局还有剩余 Track，则重复最后一首直到结算/登出
  uploadTimeoutSeconds: 60 # 等待成绩提交(UpsertUserAll)成功的超时时间(秒)
  logoutTimeoutSeconds: 60 # 等待登出(UserLogout)成功的超时时间(秒)
  loginTimeoutSeconds: 120 # 等待回到可登录界面的超时时间(秒)
dummyLogin: # 自动登录(刷卡)
  enable: true # 是否启用
  defaultUserId: 1 # 默认用户ID
fix: # 启动/联网相关修复（1.56 可能必需，可替代 AquaMai 的对应功能）
  enable: true # 是否启用
  disableEnvironmentCheck: true # 禁用运行环境检查(WarningProcess)
  disableEncryption: false # 禁用加密(仅私服需要)
  disableReboot: false # 禁用维护/自动重启
  fixCheckAuth: false # 修复 CheckAuth(仅私服需要)
  skipCakeHashCheck: false # 跳过 Cake.dll Hash 检查
  skipSpecialNumCheck: false # 跳过特殊数字检查
  skipVersionCheck: false # 登录时跳过版本检查
